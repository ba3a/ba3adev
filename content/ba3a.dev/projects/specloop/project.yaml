# The page of specloop is a landing page: index.md holds its text and the
# section markers that the theme turns into the layout (see AUTHORING.md,
# "A landing page"). The brand pictures are in themes/ba3a/assets/specloop/.
name: specloop
pitch: A spec-driven plan → implement → review loop for Claude Code. Hand it a spec, walk away, come back to a reviewed branch with one commit per step.
kind: tool
status: released
card: card.png
cardAlt: "The specloop logo, a snake biting its own tail, beside the name specloop and the line Write the spec. Go make tea. Come back to reviewed commits."
featured: true
order: 1
tag: specloop
license: 0BSD
repo: https://github.com/ba3a/specloop
# The docs are built from the specloop repository itself (nothing is copied
# here). The build clones it read-only over HTTPS into .cache/repos/specloop; a
# repository that cannot be reached fails the build. `ref: main` is a moving
# branch, so a push to specloop changes the site at the next build. There is no
# offline mode: coffer never reuses a stale checkout, so `npm test` (which builds
# the sites) needs the network, and the first build after a failed fetch clones
# again. The generated reference is cached by commit and command, and by the
# contents of the generator script the command names, so editing
# generators/specloop-reference.mjs makes the next build run it again. The guides
# are the files of its docs/ folder. docs/README.md is the documentation index,
# and `order` follows the table of contents in that README.
docs:
  source:
    git: https://github.com/ba3a/specloop.git
    ref: main
  guides:
    - dir: docs
      order:
        - installation.md
        - how-it-works.md
        - review-attempts.md
        - feature-mode.md
        - replanning.md
        - guard-rails.md
        - delegation.md
        - size-warnings.md
        - multiple-chats.md
        - updates.md
        - commands.md
        - configuration.md
        - phases.md
        - tips.md
        - limitations.md
  # The reference is generated by generators/specloop-reference.mjs (see its
  # header): the slash commands, the configuration keys and the environment
  # variables of the kit, with the descriptions found in the guides. Items
  # without a description are flagged and listed in the build report.
  reference:
    command: [node, "{site}/generators/specloop-reference.mjs", "{repo}", "{out}"]
    format: json
    output: "{out}/reference.json"
    title: specloop reference
