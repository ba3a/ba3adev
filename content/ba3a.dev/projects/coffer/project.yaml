# The page of coffer is a landing page whose text and layout settings are in
# site/landing.md of the coffer repository; the brand pictures (site/brand/) and
# the card (site/card.png) come from the same repository. The build fetches them
# from main, so a push to coffer changes the site at the next build. The theme
# turns the section markers of the file into the layout (see AUTHORING.md,
# "A landing page").
name: coffer
pitch: A static site engine for people who make things and write about them.
kind: tool
status: in-development
landing: { file: site/landing.md }
brand: { dir: site/brand }
card: repo:site/card.png
cardAlt: "The coffer logo, a treasure chest with a gold lock, beside the name coffer in light letters on a near-black background."
featured: true
order: 4
tag: coffer
license: Apache-2.0
repo: https://github.com/ba3a/coffer
# The guides are the files of docs/ in ba3a/coffer. docs/README.md is the
# documentation index, and `order` follows the table of contents in that README.
# There is no reference for now; a later edit of this file can add one.
docs:
  source:
    git: https://github.com/ba3a/coffer.git
    ref: main
  guides:
    - dir: docs
      order:
        - configuration.md
        - build.md
        - authoring.md
        - checks.md
        - posts.md
        - markdown.md
        - tags.md
        - series.md
        - links.md
        - sharing.md
        - images.md
        - location-policy.md
        - carousels.md
        - viewer.md
        - maps.md
        - media.md
        - projects.md
        - project-docs.md
        - docs-sources.md
        - home.md
        - themes.md
        - urls.md
        - feeds.md
        - seo.md
        - full-text-search.md
        - analytics.md
        - scheduling.md
