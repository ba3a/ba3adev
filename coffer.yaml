# Configuration of the two sites of this repository, built by coffer.
# Every relative path is resolved against the directory of this file.
sites:
  - id: ba3a.dev
    baseUrl: https://ba3a.dev
    lang: en
    timezone: Europe/Samara
    title: ba3a.dev
    description: Tools and games I make, and a devlog about making them.
    contentDir: content/ba3a.dev
    theme: themes/ba3a
    contentLicense: All rights reserved
    links:
      # TODO: add the LinkedIn profile URL, for example:
      # - { label: LinkedIn, url: "https://www.linkedin.com/in/<profile>" }
      - { label: GitHub, url: "https://github.com/ba3a" }
      # TODO: add the contact address as a mailto: link, for example:
      # - { label: Email, url: "mailto:<address>" }
    blogs:
      - { id: devlog, dir: content/ba3a.dev/devlog, prefix: devlog, title: Devlog, shareSummary: true }
    urls: { projects: made, docs: docs, tags: tags, series: series }
    # Featured projects are shown in the order of their `order` in project.yaml.
    projects: { dir: content/ba3a.dev/projects }
    location: { default: strip, camera: strip }

  - id: my.ba3a.dev
    baseUrl: https://my.ba3a.dev
    lang: ru
    timezone: Europe/Samara
    title: ba3a
    description: Личный блог.
    contentDir: content/my.ba3a.dev
    theme: themes/my
    contentLicense: Все права защищены
    # content/my.ba3a.dev is both the content directory and the directory of the
    # root blog, so only posts may be placed there. Pages, made/ and other
    # Markdown files would be read as posts.
    blogs:
      - { id: blog, dir: content/my.ba3a.dev, prefix: "", title: Блог }
    location: { default: strip, camera: strip }


# Original photos and videos are kept out of git, in a private Cloudflare R2 bucket, and
# listed by content hash in media.lock.json (see github.com/ba3a/coffer/blob/v0.1.0/docs/media.md). The credentials are
# never written here: coffer reads the variables named below from the environment, or from
# .env.local next to this file (see .env.local.example).
media:
  store:
    type: s3
    endpoint: https://${CLOUDFLARE_ACCOUNT_ID}.r2.cloudflarestorage.com
    bucket: ba3a-media
    region: auto
    accessKeyIdEnv: R2_ACCESS_KEY_ID
    secretAccessKeyEnv: R2_SECRET_ACCESS_KEY
  # The seed photos of the draft posts are generated, byte for byte, by
  # scripts/make-placeholders.mjs; "npm run test:sites" restores the ones that media.lock.json
  # lists and the checkout lacks, so tests need neither the store nor credentials.
  #
  # Raster images and videos below the devlog and the posts of my.ba3a.dev. The patterns spell
  # every case of an extension, because the matcher is case-sensitive and cameras write
  # IMG_0001.JPG. They are also the lines "coffer media gitignore" prints for .gitignore.
  #
  # The PNG and SVG placeholders under content/ba3a.dev/projects/ (cards, logos, key art) and
  # the Handjet font stay regular git files, because the build needs them and
  # scripts/make-placeholders.mjs generates them. `include` has no `exclude`, so the project
  # folders are left out by not being listed: a new top-level folder under a content
  # directory needs its own patterns here (and the test in scripts/test/media-config.test.mjs
  # checks that no file of the project folders is matched).
  include:
    # content/ba3a.dev/devlog
    - content/ba3a.dev/devlog/**/*.[jJ][pP][gG]
    - content/ba3a.dev/devlog/**/*.[jJ][pP][eE][gG]
    - content/ba3a.dev/devlog/**/*.[pP][nN][gG]
    - content/ba3a.dev/devlog/**/*.[hH][eE][iI][cC]
    - content/ba3a.dev/devlog/**/*.[hH][eE][iI][fF]
    - content/ba3a.dev/devlog/**/*.[wW][eE][bB][pP]
    - content/ba3a.dev/devlog/**/*.[mM][pP]4
    - content/ba3a.dev/devlog/**/*.[wW][eE][bB][mM]
    # content/my.ba3a.dev
    - content/my.ba3a.dev/**/*.[jJ][pP][gG]
    - content/my.ba3a.dev/**/*.[jJ][pP][eE][gG]
    - content/my.ba3a.dev/**/*.[pP][nN][gG]
    - content/my.ba3a.dev/**/*.[hH][eE][iI][cC]
    - content/my.ba3a.dev/**/*.[hH][eE][iI][fF]
    - content/my.ba3a.dev/**/*.[wW][eE][bB][pP]
    - content/my.ba3a.dev/**/*.[mM][pP]4
    - content/my.ba3a.dev/**/*.[wW][eE][bB][mM]
